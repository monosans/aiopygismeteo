name: Tmp called CI
on:
  push:
    branches:
      - chore/release-guards
permissions:
  contents: read
jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write # asked for by docs-deploy in ci.yml, which is skipped on a tag
      id-token: write # asked for by docs-deploy in ci.yml, which is skipped on a tag
  after-ci:
    needs: ci
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: grep -Fqx "__version__ = \"7.0.7\"" src/aiopygismeteo/__init__.py
      - run: git merge-base --is-ancestor HEAD~1 origin/main || git rev-parse origin/main
